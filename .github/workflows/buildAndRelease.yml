name: Чё писать то?

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*", "dev*" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Testing
        run: dotnet test SAS-Torrent.UnitTests/SAS-Torrent.UnitTests.csproj -c Release

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/dev')
    needs: tests

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux Native AOT dependencies
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          CLEAN_VER="${RAW_VER#dev}"
          dotnet publish SAS-Torrent.Avalonia/SAS-Torrent.Avalonia.csproj -c Release -p:Version="$CLEAN_VER" -o ./${{ matrix.rid }} -r ${{ matrix.rid }}

      - name: Переименовываем артефакт
        run: mv ./${{ matrix.rid }}/* ./${{ matrix.rid }}/SAS-Torrent_${{ matrix.rid }}

      - name: Сохраняем артефакт
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Torrent_${{ matrix.rid }}
          path: ./${{ matrix.rid }}/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/dev')
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Проверка типа релиза (dev или stable)
      id: check_version
      run: |
        TAG="${GITHUB_REF_NAME}"

        if [[ "$TAG" =~ ^dev ]]; then
          echo "Тег начинается на dev: помечаем как prerelease, latest выключаем"
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          echo "is_latest=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Если тег не dev (то есть стабильный v*), он не является prerelease
        echo "is_prerelease=false" >> "$GITHUB_OUTPUT"

        # Находим среди стабильных тегов v* максимальный по SemVer
        HIGHEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)

        # latest назначается только если текущий тег равен наибольшему стабильному
        if [ "$TAG" = "$HIGHEST_TAG" ]; then
          echo "Текущий тег $TAG является наивысшим релизом"
          echo "is_latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "Текущий тег $TAG старше или ниже максимального ($HIGHEST_TAG)"
          echo "is_latest=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Забираем артефакты
      uses: actions/download-artifact@v4
      with:
        pattern: SAS-Torrent_*
        merge-multiple: true
        path: progi

    - name: Генерация SHA256
      run: |
        cd progi
        sha256sum * > checksums.txt

    - name: Обновление тега latest
      if: steps.check_version.outputs.is_latest == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f latest
        git push -f origin latest

    - name: Создаём релиз на GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: progi/*
        prerelease: ${{ steps.check_version.outputs.is_prerelease == 'true' }}
        make_latest: ${{ steps.check_version.outputs.is_latest }}